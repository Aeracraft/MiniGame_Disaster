# Disaster 主配置
# 字段含义与取值说明见 README，部分数值仍为占位值。

# 这台子服的标识，写进对局记录与上报数据里。
# 单服部署留空即可；多台子服共用一套存储时必须各起一个名字，否则分不清数据是哪来的。
server-id: ""

storage:
  # yaml | mysql
  # mysql 用于跨服共享（玩家统计 / 服务器心跳 / 房间池 / 成就）。
  # 连不上时自动降级为 yaml，绝不允许因此阻塞或崩溃服务器。
  type: yaml

  mysql:
    host: 127.0.0.1
    port: 3306
    database: disaster
    username: root
    password: ""
    table-prefix: "ds_"
    # HikariCP 连接池
    pool-size: 6
    connection-timeout-ms: 5000

map-selection:
  # RANDOM | VOTE | ROTATE | FIXED
  mode: RANDOM
  # 是否允许玩家投票选图（仅 mode 为 VOTE 或 RANDOM 时生效）
  allow-vote: true
  # 防止连续抽中同一张地图
  avoid-repeat: true
  # 记住最近用过的几张图。只在内存里，重启即清空
  avoid-repeat-history: 3
  # 仅 mode 为 FIXED 时生效，填地图 id
  fixed-map: ""
  # 投票时长（秒）
  vote-duration-seconds: 20

rooms:
  # 全服并发房间上限。单服多房间并行，每个房间可绑定不同地图。
  # 每多开一局就多一份主线程 tick 负载，这个数字同时也是 TPS 的开关。
  max-rooms: 4
  # 一个房间就是一个副本世界目录，闲着也会占磁盘，所以要回收。
  # 空闲房间多少秒后自动卸载世界并删除目录；0 表示不自动回收，只能手动关。
  idle-timeout-seconds: 300
  # 上面那条的巡检间隔（秒）
  reap-interval-seconds: 30
  # 排队人数上限，0 表示不限
  queue-limit: 100

game:
  min-players: 4
  max-players: 16
  # 开局散开准备时间（秒）
  prepare-seconds: 10
  # 每波灾难掷骰间隔（秒）
  wave-interval-seconds: 60
  # 一局打多久（秒）。到点结算，活着的都算赢——可多人同胜，也可能无人获胜。
  # 只剩一个人时不必等满，会提前收局。
  match-duration-seconds: 600
  # 每波必出几个主灾难。一般 1，调高就是混沌局
  primary-per-wave: 1
  # 次灾难触发概率
  secondary-disaster-chance: 0.5

  # 局内规则修正器（对齐 Hypixel「私人游戏」修正器，全员配置化）
  modifiers:
    natural-regeneration: false
    fall-damage: true
    max-health: 20
    keep-inventory: false

disaster:
  # -1 表示每局随机；设为固定值可复现同一局（便于排查问题）
  random-seed: -1
  # 单个灾难的权重上限。加权掷骰是「抽中概率正比于权重」，
  # 不截断的话高权重灾种会长期霸榜，其余灾种几乎见不到。
  weight-cap: 1.75
  # 落雷预警时长（tick）。落点校验链：边界内 / 实心地面 / 非液体 /
  # 离出生点足够远 / 落点间最小间距，重抽上限 20 次，全失败则放弃本次落点。
  lightning-warning-ticks: 30
  spawn-validation:
    min-distance-from-spawn: 8
    min-distance-between-points: 3
    max-retries: 20

afk-detection:
  # L2 挂机检测：综合评分式判定，先警告后处置，挂机者不计入获胜名单。
  enabled: true
  warn-threshold-seconds: 60
  action-threshold-seconds: 120

permission:
  # 权限快照缓存有效期（秒），0 表示不缓存、每次现查。
  # 对局内的方块破坏与放置检查每 tick 要跑上百次，不缓存就每次都走一遍平台权限解析。
  # 权限变更若能被接入的权限插件上报，缓存立即失效；没接时最多等这么久生效。
  cache-ttl-seconds: 10

webhook:
  # 只出不进：本插件不监听任何端口，仅把对局数据推送到你自建的服务。
  # 每条推送都带 HMAC 签名与时间戳；失败进入本地持久化队列并指数退避重试。
  enabled: false
  url: ""
  secret: ""
  timeout-ms: 5000
  # 推送内容：match_summary | event_timeline | player_detail
  events:
    - match_summary
    - event_timeline
    - player_detail

logging:
  debug: false
