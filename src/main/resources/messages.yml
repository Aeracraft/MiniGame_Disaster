# Disaster 消息文件
# 面向玩家的文案统一从这里出口，代码中不硬编码。
# 颜色代码用 & 符号；某条留空则不发该条消息。

prefix: "&8[&6&lDisaster&8] &r"

command:
  no-permission: "{prefix}&c你没有权限执行该命令。"
  unknown-subcommand: "{prefix}&c未知的子命令：&f{input}&7，试试 &f/ds help"
  player-only: "{prefix}&c该命令只能由玩家执行。"

game:
  joined-room: "{prefix}&a你加入了房间 &f{room}&a（地图：&f{map}&a）"
  room-creating: "{prefix}&e正在为地图 &f{map} &e准备房间 &f{room}&e，拷好世界就送你过去……"
  room-ready: "{prefix}&a房间 &f{room} &a已就绪（地图：&f{map}&a）。"
  room-failed: "{prefix}&c房间创建失败：&f{reason}"
  room-closed: "{prefix}&7你所在的房间已关闭，已送你回到出生点。"
  already-in-room: "{prefix}&e你已经在房间 &f{room} &e里了，用 &f/ds leave &e先退出来。"
  not-in-room: "{prefix}&7你当前不在任何房间里。"
  queued: "{prefix}&e房间已满，你排在第 &f{position} &e位，有空位会自动拉你进去。"
  left-room: "{prefix}&7你已离开房间。"
  countdown: "{prefix}&e对局将在 &f{seconds} &e秒后开始……"
  countdown-cancelled: "{prefix}&c人数不足，开局取消。"
  not-enough-players: "{prefix}&c人数不足，至少需要 &f{required} &c人。"
  match-started: "{prefix}&6对局开始，活到最后。"
  wave: "{prefix}&c第 &f{wave} &c波：&f{disasters}"
  eliminated: "{prefix}&c你被淘汰了（&f{cause}&c），接下来可以旁观。"
  spectating: "{prefix}&7你正在旁观这一局。"
  match-ended: "{prefix}&6对局结束！用时 &f{seconds} &6秒，存活：&f{survivors}"
  no-survivors: "{prefix}&7对局结束，本局无人存活。"

room:
  not-found: "{prefix}&c找不到房间 &f{room}&c，用 &f/ds room list &c看看现有房间。"
  player-offline: "{prefix}&c玩家 &f{player} &c不在线。"
  kicked: "{prefix}&e你被 &f{staff} &e移出了房间。"
  map-not-playable: "{prefix}&c这张地图还不能开局，先用 &f/ds map info &c看缺什么。"
  queue-full: "{prefix}&c排队人数已达上限，请稍后再试。"
  name-exhausted: "{prefix}&c同一张地图的副本编号已用完，先关掉一些房间。"
  create-failed: "{prefix}&c无法创建房间：&f{reason}"

map:
  not-found: "{prefix}&c找不到地图 &f{id}&c。"
  already-exists: "{prefix}&c地图 &f{id} &c已存在。"
  invalid-id: "{prefix}&c地图 id 只能用英文小写字母、数字、下划线、点和连字符，且首尾必须是字母或数字。中文名请填 display-name。"
  created: "{prefix}&a已创建地图 &f{id}&a。接着站在图里执行 &f/ds map bounds {id} &a设边界。"
  deleted: "{prefix}&a已删除地图定义 &f{id}&a，模板世界目录没有动。"
  delete-failed: "{prefix}&c删除地图定义 &f{id} &c失败，文件可能被占用。"
  toggled: "{prefix}&a地图 &f{id} &a已{state}。"
  saved: "{prefix}&a地图 &f{id} &a已保存。"
  save-failed: "{prefix}&c保存地图 &f{id} &c失败：&f{reason}"
  reloaded: "{prefix}&a已重新扫描地图目录，共载入 &f{count} &a张。"
  bounds-not-set: "{prefix}&c该地图尚未设置边界（bounds），无法开局。"
  bounds-set: "{prefix}&a已写入地图 &f{id} &a的边界：&f{bounds}"
  bounds-need-two: "{prefix}&c先用 &f/ds map pos1 &c和 &f/ds map pos2 &c取两个对角点。"
  bounds-cross-world: "{prefix}&c两个角点不在同一个世界里。"
  pos-set: "{prefix}&a已记录 &f{which} &a= &f{point}"
  spawn-added: "{prefix}&a已加入出生点 &f{point}&a，当前共 &f{count} &a个。"
  spawn-removed: "{prefix}&a已移除第 &f{index} &a个出生点。"
  spawn-cleared: "{prefix}&a已清空地图 &f{id} &a的出生点。"
  spawn-index-invalid: "{prefix}&c序号超出范围，先用 &f/ds map spawn list {id} &c看现有编号。"
  spectator-set: "{prefix}&a已设置观战点：&f{point}"
  anchor-added: "{prefix}&a已为灾难 &f{disaster} &a加入固定落点 &f{point}"
  anchor-cleared: "{prefix}&a已清空灾难 &f{disaster} &a的固定落点。"
  loot-added: "{prefix}&a已加入补给箱位置 &f{point}"
  loot-cleared: "{prefix}&a已清空该地图的补给点。"
  template-not-loaded: "{prefix}&e世界 &f{world} &e当前没有加载，先加载它再传送。"
  scaffold-started: "{prefix}&e正在生成边长 &f{size} &e的测试城市 &f{id}&e，方块会在若干 tick 内陆续落下。"
  scaffold-done: "{prefix}&a测试城市 &f{id} &a已生成，共 &f{blocks} &a个方块，边界与出生点已写入定义。"
  scaffold-world-failed: "{prefix}&c无法加载或创建世界 &f{world}&c。"
  select-empty: "{prefix}&c没有可开局的地图，先用 &f/ds map list &c看看缺什么。"
  select-result: "{prefix}&a抽中 &f{id} &7（来源：{source}）"

disaster:
  not-found: "{prefix}&c找不到灾种 &f{id}&c，用 &f/ds disaster list &c看看有哪些。"
  reloaded: "{prefix}&a已重新扫描灾种目录，共载入 &f{count} &a个。"
  no-bounds: "{prefix}&c地图 &f{id} &c还没标边界，落点全会被拒。先执行 &f/ds map pos1&c、&f/ds map pos2 &c再 &f/ds map bounds {id}&c。"
  world-missing: "{prefix}&c找不到地图 &f{id} &c的模板世界 &f{world}&c，先加载它再试。"

storage:
  mysql-connected: "{prefix}&a已连接 MySQL：&f{host}:{port}/{database}"
  mysql-failed: "{prefix}&e连接 MySQL 失败，已临时降级为本地存储：&f{reason}"

webhook:
  queue-backlog: "{prefix}&e上报队列积压 &f{size} &e条，正在重试。"
