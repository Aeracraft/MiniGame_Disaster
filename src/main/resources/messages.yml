# Disaster 消息文件
# 面向玩家的文案统一从这里出口，代码中不硬编码。
# 颜色代码用 & 符号；某条留空则不发该条消息。

prefix: "&8[&6&lDisaster&8] &r"

command:
  no-permission: "{prefix}&c你没有权限执行该命令。"
  unknown-subcommand: "{prefix}&c未知的子命令：&f{input}&7，试试 &f/ds help"
  player-only: "{prefix}&c该命令只能由玩家执行。"

game:
  room-created: "{prefix}&a已为你创建房间 &f{room}"
  joined-room: "{prefix}&a你加入了房间 &f{room}&a（地图：&f{map}&a）"
  left-room: "{prefix}&7你已离开房间。"
  countdown: "{prefix}&e对局将在 &f{seconds} &e秒后开始……"
  not-enough-players: "{prefix}&c人数不足，至少需要 &f{required} &c人。"
  match-ended: "{prefix}&6对局结束！存活者：&f{survivors}"

map:
  bounds-not-set: "{prefix}&c该地图尚未设置边界（bounds），无法开局。"
  not-found: "{prefix}&c找不到地图 &f{id}&c。"

storage:
  mysql-connected: "{prefix}&a已连接 MySQL：&f{host}:{port}/{database}"
  mysql-failed: "{prefix}&e连接 MySQL 失败，已临时降级为本地存储：&f{reason}"

webhook:
  queue-backlog: "{prefix}&e上报队列积压 &f{size} &e条，正在重试。"
